name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iPhoneOS app
        run: |
          xcodebuild \
            -project ys.xcodeproj \
            -scheme ys \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/ys.app Payload/ys.app
          zip -r ys.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ys-ipa
          path: ys.ipa